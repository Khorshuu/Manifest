# The private research stack for a hosted environment (docs/STAGING.md, D-133):
# the worker, SearXNG and Ollama on one machine with an NVIDIA GPU, talking to
# each other over a network nothing outside can reach.
#
#   docker compose -f deploy/research-stack.compose.yml --env-file .env.staging up -d
#
# A template, not a verified deployment: it has not been run from this
# repository (no Docker or GPU where it was written). Any platform that gives
# the three services a private network and the GPU to Ollama does the same job.
#
# What makes it private:
#  - No service has a `ports:` entry, so nothing listens on the host or the
#    internet. SearXNG and Ollama are reachable only by name, from the worker.
#  - The worker publishes nothing either: it reaches out (database, email,
#    the sites it reads, the web application) and is never called.
# Outbound access stays on, because research reads the public web.
#
# `restart: unless-stopped` plus the Docker service starting at boot is what
# brings everything back after a reboot. Nobody types a start command.

name: manifest-research

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      - searxng
      - ollama
    env_file:
      # Never committed (.gitignore covers .env*). See .env.example for the names.
      - ../.env.staging
    environment:
      JOB_RUNNER: worker
      # Single-label names on this network: private by construction, so plain
      # http is accepted once remote use is allowed.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_ALLOW_REMOTE: "true"
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_ALLOW_REMOTE: "true"
      LOCAL_BROWSER_RENDERER: playwright
      LOCAL_AI_CONCURRENCY: "1"
    # Chromium needs more shared memory than a container's default 64 MB.
    shm_size: 1gb

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # Set SEARXNG_SECRET in .env.staging; any long random string.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in the env file}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      # The models. Kept across restarts so a reboot does not download 5 GB again.
      - ollama-models:/root/.ollama
    environment:
      # One request at a time, matching LOCAL_AI_CONCURRENCY=1 on the worker.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Keeps the model in memory between jobs; lower it on a GPU billed while loaded.
      OLLAMA_KEEP_ALIVE: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Downloads the model once, then exits. Safe to run again: a model that is
  # already there is not downloaded twice.
  ollama-model:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:7b}"]

volumes:
  ollama-models:
