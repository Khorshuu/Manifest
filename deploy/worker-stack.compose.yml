# The always-on CPU side of a hosted environment (docs/STAGING.md, D-133,
# D-134): the background worker and a private SearXNG, on a network nothing
# outside can reach. The model runs elsewhere, on a GPU (gpu-stack.compose.yml).
#
#   docker compose -f deploy/worker-stack.compose.yml --env-file .env.staging up -d
#
# Why the worker is not on the GPU machine: it also delivers email, expires
# unpaid orders, applies publish dates and runs every other scheduled job. A
# GPU that is stopped, restarting or switched on only for the work must not
# stop any of that. While the model is not answering, the worker leaves
# SeoPulse runs queued for up to LOCAL_AI_SERVICE_WAIT_MINUTES (30) instead
# of finishing them with the rules generator's wording, and runs everything
# else as usual.
#
# What makes it private:
#  - No service has a `ports:` entry, so nothing listens on the host or the
#    internet. SearXNG is reachable only by name, from the worker.
#  - The worker publishes nothing either: it reaches out (database, email,
#    Ollama, the sites it reads, the web application) and is never called.
# Outbound access stays on, because research reads the public web.
#
# `restart: unless-stopped` plus the Docker service starting at boot is what
# brings everything back after a reboot. Nobody types a start command.
#
# A reference, validated as far as this repository can without Docker
# (docs/PROGRESS.md records what was run). Any platform that runs the worker
# image with these settings and gives it a private SearXNG does the same job.

name: manifest-worker

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    # Tini (in the image) forwards SIGTERM and reaps the browser's processes.
    stop_grace_period: 40s
    depends_on:
      searxng:
        condition: service_healthy
    env_file:
      # Never committed (.gitignore covers .env*). See .env.example for the names
      # and docs/STAGING.md for which values the worker needs.
      - ../.env.staging
    environment:
      JOB_RUNNER: worker
      # Single-label name on this network: private by construction, so plain
      # http is accepted once remote use is allowed.
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_ALLOW_REMOTE: "true"
      LOCAL_BROWSER_RENDERER: playwright
      LOCAL_AI_CONCURRENCY: "1"
      # OLLAMA_BASE_URL and OLLAMA_ALLOW_REMOTE come from the env file: the GPU's
      # private (overlay) address, or its https gateway with OLLAMA_AUTH_TOKEN.
    # Chromium needs more shared memory than a container's default 64 MB.
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "scripts/jobs/worker-alive.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # Set SEARXNG_SECRET in .env.staging; any long random string.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in the env file}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
